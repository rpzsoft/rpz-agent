rpzag.http.host=127.0.0.1
rpzag.http.port=5011
rpzag.http.token=
rpzag.ui.dir=
rpzag.workspace=work
rpzag.data=data
rpzag.sandbox.idleMs=600000
# Sandbox containment: runs each command inside a chroot of the workspace so the
# shell cannot escape to /home or the host filesystem. Controls what the shell
# sees under /proc (i.e. whether it can observe running processes):
#   deny        empty /proc (default; least exposure)
#   namespace   fresh /proc in a new PID namespace (only this sandbox's own procs)
#   host        expose the host /proc (sees all host processes; leaky; opt-in)
#   bind:<pid>  expose exactly one host PID via bind-mount
#   off         no chroot/namespace (legacy plain process; for non-root hosts)
# Requires root/capabilities (or permitted unprivileged user namespaces); if
# containment is unavailable it falls back to "off" with a warning.
rpzag.sandbox.proc=deny
rpzag.maxTurns=24
rpzag.model.provider=openai
# OpenAI-compatible gateway base URL
rpzag.model.baseUrl=http://10.1.1.10:11100/
#rpzag.model.provider=mock
#rpzag.model.baseUrl=https://api.openai.com/v1
rpzag.model.apiKey=
rpzag.model.name=qwen3.6
rpzag.model.maxTokens=98192
rpzag.model.retries=2
rpzag.model.retry.backoffMs=1000
rpzag.permissions.bash=ask
rpzag.permissions.timeoutMs=120000
rpzag.tools.read.windowLines=400
rpzag.tools.read.maxBytes=122880
rpzag.tools.bash.maxBytes=12000
rpzag.tools.grep.maxResults=100
rpzag.tools.glob.maxResults=120
rpzag.tools.list.maxEntries=200
rpzag.tools.truncateDirection=both
rpzag.history.toolBytes=12000
